spring.application.name=LibraryManagement

# ── MySQL Configuration ──────────────────────────
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA/Hibernate ────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── H2 (for local dev without MySQL) ─────────────
# Using in-memory H2 for demo (no database setup needed):
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ── Server ───────────────────────────────────────
server.port=8080

# ── Logging ──────────────────────────────────────
logging.level.com.library=DEBUG
